name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Siapkan proyek Android
        run: |
          mkdir www
          cp index.html data1.js data2.js data3.js vario_model.js manifest.webmanifest sw.js icon-192.png icon-512.png www/
          sed -i "s/BUILD='__BUILD__'/BUILD='${{ github.run_number }}'/" www/index.html
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app@6
          npx cap init "Onar Simulator" com.onar.simulator --web-dir=www
          npx cap add android
          npx cap sync android
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${{ github.run_number }}\"/" android/app/build.gradle
      - name: Layar landscape dan ikon
        run: |
          sed -i '0,/<activity/s//<activity android:screenOrientation="landscape"/' android/app/src/main/AndroidManifest.xml
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          pip install pillow
          python3 - <<'PY'
          from PIL import Image
          import os
          src = Image.open('icon-512.png').convert('RGB')
          for k, n in {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}.items():
              p = 'android/app/src/main/res/mipmap-' + k
              os.makedirs(p, exist_ok=True)
              im = src.resize((n, n), Image.LANCZOS)
              im.save(p + '/ic_launcher.png')
              im.save(p + '/ic_launcher_round.png')
          PY
      - name: Layar penuh
        run: |
          sed -i 's|<style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">|&\n        <item name="android:windowBackground">@android:color/black</item>|' android/app/src/main/res/values/styles.xml
          cat > android/app/src/main/java/com/onar/simulator/MainActivity.java <<'JAVA'
          package com.onar.simulator;

          import android.os.Build;
          import android.os.Bundle;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  hideBars();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideBars();
              }

              private void hideBars() {
                  if (Build.VERSION.SDK_INT >= 28) {
                      getWindow().getAttributes().layoutInDisplayCutoutMode =
                          WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                  }
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                  c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                  c.hide(WindowInsetsCompat.Type.systemBars());
              }
          }
          JAVA
      - name: Siapkan keystore (pakai secret kalau valid, kalau tidak buat baru)
        env:
          KS_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          OK=0
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | tr -d '[:space:]' | base64 -d > ~/.android/debug.keystore 2>/dev/null || true
            if keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey >/dev/null 2>&1; then
              OK=1
              echo "Keystore dari secret VALID, dipakai."
            else
              echo "::warning::Keystore dari secret TIDAK valid (alias/password salah atau file rusak). Membuat keystore sementara."
            fi
          else
            echo "::warning::Secret DEBUG_KEYSTORE_B64 kosong. Membuat keystore sementara."
          fi
          if [ "$OK" = "0" ]; then
            rm -f ~/.android/debug.keystore
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "::warning::Pakai keystore sementara: update ke versi baru harus uninstall dulu."
          fi
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep -E "Alias|Signature algorithm|Valid|Key"
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Cek APK valid
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk onar-simulator.apk
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner verify --verbose --print-certs onar-simulator.apk
          $BT/aapt dump badging onar-simulator.apk | head -5
      - name: Terbitkan ke Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SIG=$(keytool -printcert -jarfile onar-simulator.apk | grep "SHA256:" | head -1 | sed 's/^[[:space:]]*//')
          echo "Tanda tangan APK: $SIG"
          gh release create "v${{ github.run_number }}" onar-simulator.apk --repo "${{ github.repository }}" --title "Onar Simulator v${{ github.run_number }}" --notes "Unduh onar-simulator.apk lalu pasang di Android. Tanda tangan (harus sama di semua versi): $SIG"
