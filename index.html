<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>GLB Studio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <b class="logo">◆ GLB Studio</b>
  <div class="tools">
    <button id="bOpen" title="Buka file">📂<span> Buka</span></button>
    <button id="bUndo" title="Undo">↶</button>
    <button id="bRedo" title="Redo">↷</button>
    <button id="bShot" title="Screenshot PNG">📷</button>
    <button id="bReset" title="Reset kamera">⟲</button>
    <button id="bFs" title="Fullscreen">⛶</button>
    <button id="bGlb" class="pri" title="Download .glb">⬇ GLB</button>
    <button id="bGltf" title="Export .gltf">⬇ glTF</button>
    <button id="bSide" class="only-m" title="Panel">☰</button>
  </div>
</header>
<main>
  <section id="view">
    <canvas id="cv"></canvas>
    <div id="empty">Seret file <b>.glb / .gltf</b> ke sini<br>atau tekan <b>Buka</b></div>
    <div id="drop">Lepas file di sini</div>
    <div id="busy" hidden><i></i> Memproses…</div>
  </section>
  <aside id="side">
    <h3>Model</h3>
    <ul id="models"></ul>
    <h3>Objek (Mesh)</h3>
    <ul id="meshes" class="scroll"></ul>
    <h3>Transform</h3>
    <div class="row"><label>Posisi</label><input id="p0" type="number" step="0.1"><input id="p1" type="number" step="0.1"><input id="p2" type="number" step="0.1"></div>
    <div class="row"><label>Rotasi°</label><input id="r0" type="number" step="5"><input id="r1" type="number" step="5"><input id="r2" type="number" step="5"></div>
    <div class="row"><label>Skala</label><input id="sc" type="number" step="0.1" min="0.001"></div>
    <h3>Material <small id="matT">(semua mesh)</small></h3>
    <div class="row"><label>Warna</label><input id="col" type="color" value="#ffffff"></div>
    <div class="row"><label>Opasitas</label><input id="op" type="range" min="0" max="1" step="0.01" value="1"></div>
    <h3>Tampilan</h3>
    <div class="row"><label>Latar</label><input id="bg" type="color" value="#14161b"></div>
    <div class="row"><label>Cahaya</label>
      <select id="light"><option value="studio">Studio</option><option value="terang">Terang</option><option value="gelap">Gelap</option></select></div>
    <div class="row"><label><input id="grid" type="checkbox" checked> Grid</label><label><input id="axes" type="checkbox" checked> Sumbu</label></div>
    <h3>Info Model</h3>
    <div id="stats">—</div>
  </aside>
</main>
<input type="file" id="file" accept=".glb,.gltf,.bin,image/*" multiple hidden>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
<script src="script.js"></script>
</body>
</html>
